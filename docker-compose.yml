services:
  postgres:
    image: postgres:15
    container_name: nanoclean-postgres
    environment:
      POSTGRES_USER: nanoclean_user
      POSTGRES_PASSWORD: nanoclean_password
      POSTGRES_DB: nanoclean_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
